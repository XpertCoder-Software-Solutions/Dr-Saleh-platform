# Production stack on the EC2 server (/var/www/dr-saleh-backend).
# Used by scripts/deploy-on-server.sh (DEPLOY_RUNTIME=docker-compose):
#   docker compose -p dr-saleh-backend -f docker-compose.prod.yml up -d --build app
# The database is external (DATABASE_URL in .env); nginx proxies to 127.0.0.1:3000.
# docker-compose.yml in this folder is for local development only.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dr-saleh-backend-app
    container_name: dr-saleh-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Redis runs in this stack; overrides REDIS_HOST from .env (localhost would be the app container).
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: dr-saleh-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
