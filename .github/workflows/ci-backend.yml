name: CI · backend

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/ci-backend.yml']
  # Deploy workflows call this before deploying, so pushes to main are checked there.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dr_saleh_platform?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:5180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
