# Backup pipeline. The main CI/CD runs on AWS CodePipeline (infra/aws, docs/deployment/aws.md).
# Manual-only while the GitHub organization's Actions billing is locked.

name: Deploy · frontend (S3 + CloudFront)

# Builds frontend/ and publishes it to the S3 bucket behind CloudFront on every
# push to main that touches it, then invalidates the CloudFront cache.
# Setup and the variables it needs: docs/deployment/aws.md

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS role, no long-lived keys

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    name: Publish to S3 + CloudFront
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check deployment settings
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=0
          for name in AWS_REGION BUCKET DISTRIBUTION_ID ROLE; do
            if [ -z "${!name}" ]; then echo "::error::Missing setting: ${name} (see docs/deployment/aws.md)"; missing=1; fi
          done
          exit "${missing}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          # The API runs on the EC2 server at api.drsalehabdelkarim.com.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.drsalehabdelkarim.com/api' }}
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        working-directory: frontend/dist
        run: |
          # Hashed bundles never change → cache for a year.
          aws s3 sync assets "s3://${BUCKET}/assets" --delete \
            --cache-control "public,max-age=31536000,immutable"
          # Everything else (images, fonts, index.html) → short cache.
          aws s3 sync . "s3://${BUCKET}" --delete --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=3600"
          aws s3 cp index.html "s3://${BUCKET}/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" --query 'Invalidation.Id' --output text
