# Runs the whole platform locally: Postgres, Redis, the API and the website.
#   Website: http://localhost:5180
#   API:     http://localhost:3100/api
# Start it with ./start-local.command (macOS) or: docker compose up -d --build
# On first run the API fills the empty database and uploads with the demo data
# (backend/demo). Secrets for local use live in .env.local (created by the start
# script, not committed).
name: dr-saleh-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drsaleh
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drsaleh"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: .env.local
    environment:
      NODE_ENV: development
      PORT: "3000"
      API_PREFIX: api
      SWAGGER_ENABLED: "true"
      DEMO_SEED: "true"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/drsaleh?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_PUBLIC_URL: http://localhost:3100
      APP_PLATFORM_URL: http://localhost:5180
      CORS_ALLOWED_ORIGINS: http://localhost:5180
      THROTTLE_LIMIT: "10000"
      PAYMOB_REDIRECTION_URL: http://localhost:5180/checkout/result
      PAYPAL_RETURN_URL: http://localhost:5180/checkout/result
      PAYPAL_CANCEL_URL: http://localhost:5180/checkout/result
    ports:
      - "3100:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    # npm can skip platform packages (Vite/Tailwind native bindings) silently when a
    # download fails, so check they load and reinstall until they do.
    command:
      - sh
      - -c
      - |
        for i in 1 2 3 4 5; do
          npm ci --no-audit --no-fund --fetch-retries=5 &&
          node -e "Promise.all(['rolldown','@tailwindcss/oxide','lightningcss','react-icons/fa6'].map(m=>import(m))).then(()=>process.exit(0),e=>{console.error('missing:',e.message);process.exit(1)})" &&
          break
          echo "install incomplete, retrying ($$i)"; sleep 5
        done
        exec npx vite --host 0.0.0.0 --port 5180 --strictPort
    environment:
      VITE_DEV_BACKEND_URL: http://api:3000
    ports:
      - "5180:5180"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
