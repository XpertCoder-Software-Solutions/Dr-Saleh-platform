# Nginx on the EC2 server, as the origin for the CloudFront distribution.
# CloudFront terminates HTTPS and forwards /api/* and /uploads/* here over HTTP,
# so this works without a domain. Lock port 80 in the EC2 security group to the
# CloudFront origin-facing prefix list (com.amazonaws.global.cloudfront.origin-facing).
# When a domain is added, the TLS config in backend/docs/deployment/nginx.dr-saleh-api.conf
# can be used instead.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 30s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
