# CodeBuild: backend lint, unit tests and build (same checks as CI on pull requests).
version: 0.2
env:
  variables:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dr_saleh_platform?schema=public
    JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
    JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
    CORS_ALLOWED_ORIGINS: http://localhost:5180
phases:
  install:
    runtime-versions:
      nodejs: 22
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend"
      - npm ci
      - npx prisma generate
      - npx eslint "{src,apps,libs,test}/**/*.ts"
      - npm test
      - npm run build
cache:
  paths:
    - /root/.npm/**/*
